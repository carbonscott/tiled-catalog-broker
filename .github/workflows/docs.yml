name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "includes/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "includes/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Let an in-flight publish finish rather than killing it mid-deploy; two merges in
# quick succession queue instead of racing to be last writer.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Build the site
        run: uv run --no-project --with 'mkdocs-material>=9,<10' mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing only happens on main; a pull request gets the build check alone.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
