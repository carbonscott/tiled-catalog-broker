# Tiled server configuration (local / development server)
#
# Start it from the repo root:
#   uv run --with 'tiled[server]' tiled serve config config.yml --api-key secret
# Nothing here assumes a particular machine or facility; a deployment elsewhere keeps its
# own copy of this file with its own storage roots.
uvicorn:
  host: "127.0.0.1"
  port: 8005

trees:
  - path: /
    tree: catalog
    args:
      uri: "sqlite:///catalog.db"
      init_if_not_exists: true
      writable_storage: "storage"
      # The broker registers pointer artifacts under its own mimetype so the server
      # slices in h5py instead of materializing the whole dataset through dask
      # (docs/explanation/sliced-reads.md). Tiled only dispatches a mimetype it has been
      # told about: without this mapping, `tcb register` (without --upload) creates the
      # nodes and then every read of them returns HTTP 500. Any server that receives
      # pointer registrations needs this block.
      adapters_by_mimetype:
        application/x-hdf5-broker: "tiled_catalog_broker.adapters.lazy_hdf5:LazyHDF5ArrayAdapter"
      # The server serves `file://` arrays only from under these roots; anything outside
      # them is refused at read time. List every dataset's data root *as the server sees
      # it* (docs/ONBOARDING.md, "Paths"). Relative entries resolve against the directory
      # the server is started from; `$ENV_VARS` are expanded. Roots that do not exist on
      # this machine are harmless — they simply never match.
      readable_storage:
        # Repo-local datasets: ./data/<DATASET>/... (workshop/demo data, local copies)
        - "data"
        # SLAC SDF deployment roots (no effect off SDF)
        - "/sdf/group/mli/samklein/code/sbi_maq/results/edrixs_tsnpe_scaled_data/initial_data_proper"
        - "/sdf/data/lcls/ds/prj/prjmaiqmag01/results/data-source/NiPS3_Multimodal_Synthetic/data"
        - "/sdf/data/lcls/ds/prj/prjmaiqmag01/results/data-source/data-tlinker/SUNNY/NIPS_10000"
        - "/sdf/data/lcls/ds/prj/prjmaiqmag01/results/vdp/data/schema_v1"
