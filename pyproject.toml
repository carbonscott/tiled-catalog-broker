[project]
name = "tiled-catalog-broker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "h5py",
    "numpy",
    "ruamel.yaml",
    "pydantic>=2",
    "tiled[server]",
]

[project.optional-dependencies]
examples = [
    "marimo>=0.24.0",
]
test = [
    "pytest",
]

[project.scripts]
tcb = "tiled_catalog_broker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tiled_catalog_broker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "integration: needs a running Tiled server with data registered",
]
