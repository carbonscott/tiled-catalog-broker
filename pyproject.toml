[project]
name = "tiled-catalog-broker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "h5py",
    "numpy",
    "ruamel.yaml",
    "pydantic>=2",
    "tiled[server]",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
tcb = "tiled_catalog_broker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = ">=3.12"

[tool.pixi.pypi-dependencies]
tiled-catalog-broker = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }

[tool.hatch.build.targets.wheel]
packages = ["src/tiled_catalog_broker"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` also collects the vendored Tiled checkout under
# amsc-connector/ and dies on its dependencies.
testpaths = ["tests"]
markers = [
    "integration: needs a running Tiled server with data registered",
]
